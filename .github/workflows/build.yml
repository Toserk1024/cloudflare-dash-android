name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore version counter
        uses: actions/cache@v4
        with:
          path: version.properties
          key: version-counter-v2-${{ hashFiles('version.properties') }}
          restore-keys: |
            version-counter-v2-

      - name: Prepare release signing keystore
        env:
          BUILD_KEYSTORE_BASE64: ${{ secrets.BUILD_KEYSTORE_BASE64 }}
          BUILD_STORE_PASSWORD: ${{ secrets.BUILD_STORE_PASSWORD }}
          BUILD_KEY_ALIAS: ${{ secrets.BUILD_KEY_ALIAS }}
          BUILD_KEY_PASSWORD: ${{ secrets.BUILD_KEY_PASSWORD }}
        run: |
          if [ -n "$BUILD_KEYSTORE_BASE64" ]; then
            echo "$BUILD_KEYSTORE_BASE64" | base64 -d > app/cfdash-release.jks
            echo "BUILD_STORE_FILE=app/cfdash-release.jks" >> $GITHUB_ENV
            echo "BUILD_STORE_PASSWORD=$BUILD_STORE_PASSWORD" >> $GITHUB_ENV
            echo "BUILD_KEY_ALIAS=$BUILD_KEY_ALIAS" >> $GITHUB_ENV
            echo "BUILD_KEY_PASSWORD=$BUILD_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Install required SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
