name: Release APK

on:
  workflow_dispatch:
    inputs:
      include_same_day:
        description: '把「与上次发布同一天」的 changelog 条目也写入 Release Notes'
        type: boolean
        default: false

# 创建 Release 需要写权限（GITHUB_TOKEN）
permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore version counter
        uses: actions/cache@v5
        with:
          path: version.properties
          # key 用 github.run_id（每次构建唯一）而非 hashFiles：
          # version.properties 每次 checkout 都被重置为仓库值，hashFiles 恒等导致 restore 永远精确不匹配，
          # restore-keys 前缀匹配最近一次构建保存的缓存，从而可靠恢复上次 buildSeq 实现版本号自增
          key: version-counter-v2-${{ github.run_id }}
          restore-keys: |
            version-counter-v2-

      - name: Prepare release signing keystore
        env:
          BUILD_KEYSTORE_BASE64: ${{ secrets.BUILD_KEYSTORE_BASE64 }}
          BUILD_STORE_PASSWORD: ${{ secrets.BUILD_STORE_PASSWORD }}
          BUILD_KEY_ALIAS: ${{ secrets.BUILD_KEY_ALIAS }}
          BUILD_KEY_PASSWORD: ${{ secrets.BUILD_KEY_PASSWORD }}
        run: |
          if [ -n "$BUILD_KEYSTORE_BASE64" ]; then
            echo "$BUILD_KEYSTORE_BASE64" | base64 -d > app/cfdash-release.jks
            echo "BUILD_STORE_FILE=app/cfdash-release.jks" >> $GITHUB_ENV
            echo "BUILD_STORE_PASSWORD=$BUILD_STORE_PASSWORD" >> $GITHUB_ENV
            echo "BUILD_KEY_ALIAS=$BUILD_KEY_ALIAS" >> $GITHUB_ENV
            echo "BUILD_KEY_PASSWORD=$BUILD_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Install required SDK components
        # SDK 37 的平台包按小版本号命名（android-37.0/37.1/37.2），不存在 platforms;android-37。
        # 额外建 android-37 符号链接，兼容按旧命名查找平台的工具链。
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          cd "$ANDROID_HOME/platforms"
          [ -e android-37 ] || ln -s android-37.0 android-37
          ls -l "$ANDROID_HOME/platforms"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_SAME_DAY: ${{ inputs.include_same_day }}
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$ANDROID_HOME/build-tools/37.0.0/aapt

          # versionName 形如 2026.10.18_3 → 去掉 _序号并加 v 作为 Tag
          VN=$($AAPT dump badging "$APK" | grep -oP "versionName='\K[^']+")
          REV="${VN%_*}"
          TAG="v$REV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          # Tag 已存在时直接失败（避免同日重复发布静默覆盖）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。如需再次发布，请先删除该 Release 与 Tag（gh release delete $TAG --yes --cleanup-tag）。"
            exit 1
          fi

          # 上一个 Release 的日期（用于确定 changelog 的增量范围）
          LAST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-prereleases --json tagName -q '.[0].tagName' 2>/dev/null || true)
          LAST_REV="${LAST_TAG#v}"
          echo "上一个 Release：${LAST_TAG:-（无，首次发布）}"

          NOTES=/tmp/release_notes.md
          python3 - "$TAG" "$LAST_REV" "${INCLUDE_SAME_DAY:-false}" > "$NOTES" <<'PY'
          import re
          import sys

          tag, last_rev, include_same_day = sys.argv[1], sys.argv[2], (sys.argv[3] == "true")

          with open("changelog.md", encoding="utf-8") as f:
              lines = f.read().splitlines()

          # 兼容 "## 2026.10.18" 与 "##2026.10.18" 两种写法
          date_re = re.compile(r"^##\s*(\d{4}\.\d{2}\.\d{2})\s*$")
          blocks = []          # [(date, [lines...])]
          current = None
          for line in lines:
              m = date_re.match(line.strip())
              if m:
                  current = [m.group(1), []]
                  blocks.append(current)
              elif current is not None:
                  current[1].append(line)

          def key(d):
              return tuple(int(x) for x in d.split("."))

          def cleanup(body):
              # 去掉首尾空行，保持内部结构
              while body and not body[0].strip():
                  body.pop(0)
              while body and not body[-1].strip():
                  body.pop()
              return body

          selected = []
          for date, body in blocks:
              if not last_rev:
                  keep = True                                  # 首次发布：全部收录
              elif key(date) > key(last_rev):
                  keep = True                                  # 上次发布之后的日期块
              elif include_same_day and key(date) == key(last_rev):
                  keep = True                                  # 手动选择：包含同日增量
              else:
                  keep = False
              if keep:
                  body = cleanup(body)
                  if body:
                      selected.append((date, body))

          out = [f"## {tag} 更新内容", ""]
          if not selected:
              out.append("本次发布未在 `changelog.md` 中发现新增记录（可能为构建/配置类变更）。")
          else:
              for date, body in selected:
                  # 保留原 ### 小标题与其下条目，日期块以 #### 形式标注
                  out.append(f"#### {date}")
                  out.append("")
                  out.extend(body)
                  out.append("")
          out.append("---")
          out.append("详见 [changelog.md](https://github.com/Toserk1024/cloudflare-dash-android/blob/main/changelog.md)")
          print("\n".join(out).strip())
          PY

          echo "----- Release Notes -----"
          cat "$NOTES"
          echo "-------------------------"

          gh release create "$TAG" "$APK" --title "$TAG" --notes-file "$NOTES"
